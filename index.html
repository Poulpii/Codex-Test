<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Copropro — Sujets de Copropriété</title><meta name="description" content="Prototype HTML de suivi des sujets de copropriété avec contenus Markdown."><link rel="stylesheet" href="assets/styles.css"></head>
<body>
<header class="app-header"><div class="header-container"><div class="header-main-row"><div class="brand-section"><div class="brand-info"><h1 id="app-main-title" data-edit="app-title">Copropro</h1><p>📍 <span id="app-main-subtitle" data-edit="app-subtitle"></span></p></div></div><div class="header-actions"><button id="edit-toggle-btn" class="btn-ctrl" type="button">🛠️ Éditer le texte</button><button id="theme-toggle-btn" class="btn-ctrl" type="button" aria-label="Activer le thème sombre" title="Activer le thème sombre">🌙</button></div></div><div class="stats-grid"><button class="stat-card" data-stat-filter="active" type="button"><div class="stat-num normal" id="stat-total">0</div><div class="stat-label">Sujets Actifs</div></button><button class="stat-card" data-stat-filter="urgent" type="button"><div class="stat-num urgent" id="stat-urgent">0</div><div class="stat-label">Urgents / Critiques</div></button><button class="stat-card" data-stat-filter="todo" type="button"><div class="stat-num warning" id="stat-warning">0</div><div class="stat-label">À Traiter</div></button><button class="stat-card" data-stat-filter="partial" type="button"><div class="stat-num info" id="stat-info">0</div><div class="stat-label">Sujet partiellement traité</div></button><button class="stat-card" data-stat-filter="resolved" type="button"><div class="stat-num success" id="stat-resolved">0</div><div class="stat-label">Sujets Traités</div></button></div></div></header>
<div id="edit-banner" class="edit-banner"><span>Mode édition actif — les changements de sujet sont enregistrés par la web app locale dans Contents et Documents.</span><div class="edit-banner-actions"><button id="header-bold-btn" class="btn-ctrl header-format-btn" type="button"><strong>Texte en gras</strong></button><button id="header-list-btn" class="btn-ctrl header-format-btn" type="button">• Liste</button></div></div>
<section class="content-loader"><div id="content-loader-status" class="content-loader-status" aria-live="polite"></div></section>
<section class="controls-bar"><div class="filter-tabs" id="filter-tabs"></div><div class="search-box"><span class="search-icon">⌕</span><input type="text" id="search-input" class="search-input" placeholder="Rechercher un sujet, mot-clé, document..."></div><div class="new-topic-row"><button id="new-topic-btn" class="btn-ctrl new-topic-btn" type="button">+ Nouveau Sujet</button></div></section>
<main class="dashboard-layout"><section class="topics-section" id="topics-section"></section><aside class="sidebar"><div class="document-explorer"><h3>Explorateur de Documents</h3><div id="document-explorer-tree"></div></div></aside></main>
<dialog id="new-topic-dialog" class="new-topic-dialog"><form id="new-topic-form" class="new-topic-form" method="dialog"><h2>Nouveau sujet</h2><div class="field-row"><label>Filtre <select id="new-topic-filter" required></select></label><label>Statut <select id="new-topic-status"><option value="todo">À traiter</option><option value="urgent">Urgent / Critique</option><option value="partial">Partiellement traité</option><option value="resolved">Traité</option></select></label></div><label>Titre <input id="new-topic-title" type="text" placeholder="Ex. Nouveau dossier à suivre" required></label><label>Contexte <div class="modal-format-toolbar"><button type="button" class="format-btn" id="new-topic-bold-btn"><strong>Texte en gras</strong></button><button type="button" class="format-btn" id="new-topic-list-btn">• Liste</button></div><textarea id="new-topic-body" placeholder="Décrivez le contexte du sujet..."></textarea></label><div class="new-topic-actions-block"><div class="new-topic-actions-header"><span>Proposition d'Action</span><button type="button" class="btn-ctrl new-topic-action-add" id="new-topic-action-add">+ Ajouter</button></div><div id="new-topic-actions-list" class="new-topic-actions-list"></div></div><div class="new-topic-dialog-actions"><button type="button" class="btn-ctrl" id="new-topic-cancel">Annuler</button><button type="submit" class="btn-ctrl new-topic-btn">Créer le sujet</button></div></form></dialog>
<dialog id="lightbox" class="lightbox-dialog"><div class="lightbox-content"><div class="lightbox-header"><div id="lightbox-title" class="lightbox-title"></div><button id="lightbox-close" class="lightbox-close-btn" type="button">×</button></div><div class="lightbox-img-wrapper"><img id="lightbox-img" alt="Document visuel"></div><div id="lightbox-desc" class="lightbox-footer"></div></div></dialog>
<script src="assets/app.js"></script></body></html>
